<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Audio-Reactive Visualizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        background-color: #111; /* Dark background for better visuals */
        overflow: hidden;
      }

  </body>
</html>
